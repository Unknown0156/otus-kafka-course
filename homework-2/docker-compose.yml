services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # Listeners
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Topic configuration
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Transactions
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9093 \
          --create \
          --if-not-exists \
          --topic orders \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka initialization completed"
        echo "Topic 'orders' with 3 partitions is ready"

  producer:
    build:
      context: ./producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer-1:
    build:
      context: ./consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      CONSUMER_NAME: consumer-1
      GROUP_ID: orders-consumer-group
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer-2:
    build:
      context: ./consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      CONSUMER_NAME: consumer-2
      GROUP_ID: orders-consumer-group
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer-3:
    build:
      context: ./consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      CONSUMER_NAME: consumer-3
      GROUP_ID: orders-consumer-group-2
    depends_on:
      kafka-init:
        condition: service_completed_successfully